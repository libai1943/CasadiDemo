# vehicle parameters
back_edge_to_center: 0.929
wheel_base: 2.8
length: 4.689
width: 1.942
max_acceleration: 0.4
max_deceleration: -0.4

max_velocity: 2.5

# set to zero is reverse is disabled m
max_reverse_velocity: -2.5

# vehicle max steer angle
max_steer_angle: 0.7

# vehicle max steer rate how fast can the steering wheel turn.
max_steer_angle_rate: 0.5

# ratio between the turn of steering wheel and the turn of wheels
steer_ratio: 1

# hybrid A* parameters
xy_grid_resolution: 0.3
phi_grid_resolution: 0.05
next_node_num: 6
step_size: 0.5
traj_forward_penalty: 1.0
traj_back_penalty: 4.0
traj_gear_switch_penalty: 20.0
traj_steer_penalty: 0.5
traj_steer_change_penalty: 1.0
grid_a_star_xy_resolution: 0.5
dubins_phi_gamma: 1.1

analytic_expansion_cost: 20.0
explore_node_num: 100000

# optimization parameters
nfe: 101
tf_max: 5000.0
corridor_max_iter: 1000
corridor_incremental_limit: 5.0

# Cost function weights
opti_omega: 0.01
opti_a: 0.01
opti_phi: 0.01

# LIOM iteration parameters
opti_iter_max: 100
opti_w_penalty0: 1000.0
opti_alpha: 3.0
opti_w_penalty_max: 1000000.0
opti_varepsilon_tol: 0.000001
opti_solution_norm_tol: 0.1
